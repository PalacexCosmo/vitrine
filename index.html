<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Palace</title>
<!--
  Lecteur de playlist sur mesure, commun à :
    - prototype/playlist.html : écrans confiserie du Palace (réseau local, /api/playlist/<nom>) ;
    - vitrine/index.html      : écran du commerçant partenaire (GitHub Pages, ./ecrans/<nom>.json).
  FICHIER GÉNÉRÉ, ne pas modifier à la main. Les deux fichiers sont générés depuis prototype/lecteur-source.html par prototype/generer-lecteurs.py :
  modifier la source, puis relancer le script.

  Éléments (servis par serveur/playlists.js) :
    { type: "image", media, duree }                 image plein écran, jamais recadrée, pendant duree s
    { type: "video", media, duree, titre?, bientot? } vidéo sans le son ; duree 0 = jouée en entier, sinon coupée
    { type: "film", titre, affiche, dureeFilm, classification, seances: [{ debut, version, salle }], duree }
    { type: "seances", seances: [{ titre, debut, version, salle }], duree }   prochaines séances (7 lignes)
    { type: "semaine", films: [{ titre, affiche?, seances: [{ debut, version, salle }] }], duree }
                                                   programme de la semaine : une ligne par film, 7 jours à partir
                                                   d'aujourd'hui ; plusieurs pages si besoin, qui se partagent duree
  Programmation, facultative sur chaque élément, appliquée à l'heure de l'écran (même règle que Playlists.programme) :
    actif:false, dateDebut / dateFin "AAAA-MM-JJ", jours [1..7] (1 = lundi), heureDebut / heureFin "HH:MM"
    (heureFin avant heureDebut : le créneau passe minuit).

  Compatibilité vieux navigateurs Samsung (WebKit série D, Tizen 2.4) : ES5, ni var(), flex, gap, inset, object-fit
  ni calc ; tout est dessiné sur une scène fixe de 1920x1080 px réduite par -webkit-transform: scale().
  Les vidéos sont hors de la scène (les vieux lecteurs gèrent mal les transformations). Heures des séances lues
  dans la chaîne debut (HH:MM), jamais via le fuseau de l'écran.

  Paramètres d'URL :
    ?ecran=<nom>     nom de l'écran (obligatoire)
    &demo=1          playlist de démonstration
    &cinema=cosmo    charte Cosmo (sinon le champ « cinema » du fichier, sinon Palace)
    &orientation=portrait|paysage  (sinon déduite de l'écran : plus haut que large = portrait, scène 1080x1920)
    &maintenant=…    (essais) fige l'heure de l'écran, ex. 2026-11-05T13:20:00+01:00
-->
<style>
  @font-face { font-family: 'Afacad'; font-weight: 400; src: url('polices/Afacad-400.ttf') format('truetype'); }
  @font-face { font-family: 'Afacad'; font-weight: 600; src: url('polices/Afacad-600.ttf') format('truetype'); }
  @font-face { font-family: 'Afacad'; font-weight: 700; src: url('polices/Afacad-700.ttf') format('truetype'); }
  @font-face { font-family: 'Pathway Gothic One'; font-weight: 400; src: url('polices/PathwayGothicOne-400.ttf') format('truetype'); }

  /* Proportions au nombre d'or (φ = 1,618), écran 1920x1080 (L x H), comme l'écran caisse.
     Longueurs de la suite  H/φ = 667 · H/φ² = 413 · H/φ³ = 255 · H/φ⁴ = 158 · H/φ⁵ = 97 · H/φ⁶ = 60 · H/φ⁷ = 37
                            L/φ = 1187 · L/φ² = 733 · L/φ³ = 453 · L/φ⁴ = 280 · L/φ⁵ = 173 · L/φ⁶ = 107 · L/φ⁷ = 66
     Textes : 189 · 117 · 72 · 44 · 28 px (chaque taille = la précédente / φ)
     Espaces : 13 · 20 · 32 · 52 · 85 px (×φ)
     Fiche film : affiche L/φ² | infos L/φ ; marge de l'affiche H/φ⁷.
     Prochaines séances : marges L/φ⁷ et H/φ⁶ ; en-tête jusqu'à H/φ³ ; 5 lignes de H/φ⁴ ;
                          colonnes accès L/φ³ · heure L/φ⁴ · salle L/φ⁵ · film le reste.
     Semaine : en-tête jusqu'à H/φ³ ; colonne film L/φ³ ; lignes H/φ⁵ ; en-têtes de jours H/φ⁶. */
  * { -webkit-box-sizing: border-box; box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; cursor: none; background: #000; color: #F4F2EC; }
  body { font-family: 'Afacad', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .scene { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000;
    -webkit-transform-origin: 0 0; transform-origin: 0 0; }
  .titre, .heures, .attente b, .placeholder span, .ligne .h, .ligne .t, .ligne .s b, .tableau h1, .bandeau .texte, .demo-visuel b { font-family: 'Pathway Gothic One', 'Afacad', 'Arial Narrow', sans-serif; font-weight: 400; }

  /* Couches : une par élément, fondu enchaîné */
  .couche { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; overflow: hidden; background: #131316; opacity: 0;
    -webkit-transition: opacity .8s; transition: opacity .8s; }
  .couche.noir { background: #000; }
  .couche.visible { opacity: 1; }
  .couche .media { position: absolute; }

  /* Fiche film */
  .fond { position: absolute; top: -65px; left: -65px; width: 2050px; height: 1113px; background-position: center; background-repeat: no-repeat;
    -webkit-background-size: cover; background-size: cover;
    -webkit-filter: blur(48px) saturate(1.15) brightness(.7); filter: blur(48px) saturate(1.15) brightness(.7); }
  .voile { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; background: rgba(19,19,22,.6);
    background: -webkit-linear-gradient(left, rgba(19,19,22,.05) 15%, rgba(19,19,22,.6) 45%, rgba(19,19,22,.88) 100%);
    background: linear-gradient(90deg, rgba(19,19,22,.05) 15%, rgba(19,19,22,.6) 45%, rgba(19,19,22,.88) 100%); }
  .affiche { position: absolute; top: 0; left: 0; width: 733px; height: 1080px; }
  .affiche img { position: absolute; -webkit-box-shadow: 0 13px 40px rgba(0,0,0,.6); box-shadow: 0 13px 40px rgba(0,0,0,.6); }

  .infos { position: absolute; top: 0; left: 733px; width: 1187px; height: 1080px; display: table; table-layout: fixed; }

  .rubrique { font-size: 28px; line-height: 1; font-weight: 600; color: #DA5A7E; text-transform: uppercase; letter-spacing: .2em; }

  .tableau { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; padding: 60px 66px 0; }

  .entetes span { display: inline-block; }

  .ligne > span { display: inline-block; height: 158px; line-height: 158px; vertical-align: top; }
  .ligne .v, .entetes .v { width: 453px; }
  .ligne .v i { display: inline-block; width: 60px; height: 60px; border-radius: 50%; vertical-align: middle; margin: 0 32px 0 13px; }
  .ligne .v span { display: inline-block; vertical-align: middle; line-height: 1; font-size: 44px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .ligne .v small { display: block; margin-top: 13px; font-size: 28px; font-weight: 600; letter-spacing: .03em; text-transform: none; color: #B8B6AE; }
  .ligne.acces-ouvert .v i { background: #3FD07F; -webkit-box-shadow: 0 0 37px rgba(63,208,127,.7); box-shadow: 0 0 37px rgba(63,208,127,.7); }
  .ligne.acces-ouvert .v span { color: #3FD07F; }
  .ligne.acces-ferme .v i { background: #E5484D; -webkit-box-shadow: 0 0 32px rgba(229,72,77,.55); box-shadow: 0 0 32px rgba(229,72,77,.55); }
  .ligne.acces-ferme .v span { color: #FF6B70; }
  .ligne.acces-ouvert { background: rgba(63,208,127,.10); }
  .ligne .h, .entetes .h { width: 280px; }
  .ligne .h { font-size: 117px; letter-spacing: .02em; }
  .ligne .s, .entetes .s { width: 173px; }
  .ligne .s b { display: inline-block; width: 97px; height: 97px; line-height: 101px; text-align: center; border-radius: 8px; background: #C12C57; color: #FFF; font-size: 72px; font-weight: 400; vertical-align: middle; }
  .ligne .t { max-width: 800px; overflow: hidden; text-overflow: ellipsis; font-size: 72px; text-transform: uppercase; letter-spacing: .05em; }
  .ligne em { display: inline-block; vertical-align: top; margin-top: 44px; }

  /* Programme de la semaine : films en lignes, 7 jours en colonnes (aujourd'hui en premier, surligné) */
  .semaine { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; padding: 60px 66px 0; }
  .semaine .filet { margin: 20px 0 20px; }
  .semaine h1 { font-family: 'Pathway Gothic One', Arial, sans-serif; font-weight: 400; text-transform: uppercase; letter-spacing: .06em; font-size: 72px; line-height: 1; white-space: nowrap; }
  .semaine .page { position: absolute; top: 60px; right: 66px; font-size: 28px; color: #8A8880; letter-spacing: .1em; }
  .grille { position: absolute; top: 255px; left: 66px; width: 1788px; border-collapse: collapse; table-layout: fixed; }
  .grille th { height: 60px; font-size: 20px; font-weight: 600; color: #B8B6AE; text-transform: uppercase; letter-spacing: .14em; text-align: center; vertical-align: middle; line-height: 1; }
  .grille th b { display: block; margin-top: 4px; font-family: 'Pathway Gothic One', Arial, sans-serif; font-weight: 400; font-size: 28px; letter-spacing: .04em; color: #F4F2EC; }
  .grille th.film { text-align: left; }
  .grille td { height: 97px; border-top: 1px solid #2A2A30; text-align: center; vertical-align: middle; font-family: 'Pathway Gothic One', Arial, sans-serif; font-size: 36px; line-height: 42px; letter-spacing: .02em; }
  .grille td .c { max-height: 84px; overflow: hidden; }   /* 2 lignes d'horaires au plus */
  .grille td.film { text-align: left; white-space: nowrap; overflow: hidden; }
  .grille td.film img { display: inline-block; width: 47px; height: 71px; vertical-align: middle; margin-right: 20px; }
  .grille td.film span { display: inline-block; max-width: 370px; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; font-size: 44px; text-transform: uppercase; letter-spacing: .05em; }
  .grille td span.h { display: inline-block; margin: 0 6px; white-space: nowrap; }
  .grille td span.h.passee { opacity: .3; }
  .grille td span.h i { font-style: normal; font-family: 'Afacad', Arial, sans-serif; font-size: 17px; font-weight: 700; color: #B8B6AE; margin-left: 2px; position: relative; top: -14px; line-height: 0; vertical-align: baseline; }   /* exposant sans agrandir la ligne */
  .grille .auj { background: rgba(193,44,87,.16); }
  .grille th.auj { border-top: 6px solid #C12C57; letter-spacing: .04em; }

  /* Logo du cinéma en filigrane, en bas à droite (pas de bandeau : tout l'écran sert au contenu) */
  .filigrane { position: absolute; right: -97px; bottom: -97px; width: 667px; height: auto; opacity: .06; }

  /* Écran d'attente : rien de programmé à cette heure */
  .attente { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; display: table; background: #000; }
  .attente div { display: table-cell; vertical-align: middle; text-align: center; }
  .attente img { width: 380px; height: auto; opacity: .5; }
  .attente b { display: block; margin-top: 40px; text-transform: uppercase; letter-spacing: .06em; font-size: 52px; color: #8A8880; }

  /* Visuels de démonstration (admin) */
  .demo-visuel { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; display: table; text-align: center; }
  .demo-visuel div { display: table-cell; vertical-align: middle; padding: 115px; }
  .demo-visuel b { display: block; text-transform: uppercase; letter-spacing: .06em; font-size: 192px; line-height: 1; }
  .demo-visuel span { display: block; margin-top: 27px; font-size: 54px; font-weight: 600; }

  /* Charte Cosmo : noir cinéma, or moutarde, ambre */
  .cosmo .couche, .cosmo .scene { background: #0E0E10; }
  .cosmo .rubrique, .cosmo .jour .lib { color: #F0B660; }
  .cosmo .filet, .cosmo .ligne .s b { background: #CFA94E; }
  .cosmo .ligne .s b { color: #241A06; }
  .cosmo .grille .auj { background: rgba(207,169,78,.14); }
  .cosmo .grille th.auj { border-top-color: #CFA94E; }
  .cosmo .badge { border-color: #F0B660; color: #F0B660; }
  .cosmo .placeholder { border-top-color: #CFA94E; }
  .cosmo #video-zone .legende b { color: #F0B660; }


  /* ===== Écran en portrait (1080x1920), détecté automatiquement ou forcé par &orientation=portrait =====
     Suite du nombre d'or :  L/φ = 667 · 413 · 255 · 158 · 97 · 60 · 37   (L = 1080)
                             H/φ = 1187 · 733 · 453 · 280 · 173 · 107 · 66 (H = 1920)
     Marges L/φ⁶ (60) et H/φ⁷ (66). */
  .portrait .scene, .portrait .couche, .portrait .voile, .portrait .attente, .portrait .demo-visuel { width: 1080px; height: 1920px; }
  /* Fiche film : affiche en haut jusqu'à H/φ, infos dessous sur H/φ² */
  .portrait .fond { width: 1210px; height: 2050px; }
  .portrait .voile { background: rgba(19,19,22,.6);
    background: -webkit-linear-gradient(top, rgba(19,19,22,.05) 20%, rgba(19,19,22,.6) 55%, rgba(19,19,22,.92) 75%);
    background: linear-gradient(180deg, rgba(19,19,22,.05) 20%, rgba(19,19,22,.6) 55%, rgba(19,19,22,.92) 75%); }
  .portrait .affiche { width: 1080px; height: 1187px; }
  .portrait .placeholder { top: 66px; left: 179px; width: 723px; height: 1084px; }
  .portrait .infos { top: 1187px; left: 0; width: 1080px; height: 733px; }
  .portrait .infos .centre { vertical-align: top; padding: 37px 60px 66px; }
  .portrait .jours { margin-top: 32px; }
  /* Prochaines séances : 5 lignes de H/φ⁴ ; voyant en haut de ligne, heure + salle + film dessous */
  .portrait .tableau { width: 1080px; height: 1920px; padding: 66px 60px 0; }
  .portrait .entetes { display: none; }
  .portrait .lignes { top: 453px; left: 60px; width: 960px; }
  .portrait .ligne { height: 280px; }
  .portrait .ligne > span { position: absolute; height: auto; line-height: 1; }
  .portrait .ligne .v { top: 32px; left: 0; width: 960px; }
  .portrait .ligne .v i { margin: 0 32px 0 0; }
  .portrait .ligne .v small { display: inline; margin: 0 0 0 20px; }
  .portrait .ligne .h { top: 130px; left: 0; width: 280px; }
  .portrait .ligne .s { top: 140px; left: 280px; width: 130px; }
  .portrait .ligne .t { top: 152px; left: 413px; width: 547px; max-width: 547px; }
  .portrait .ligne em { position: absolute; top: 236px; left: 413px; margin: 0; vertical-align: baseline; }
  /* Programme de la semaine : une page par jour, 8 films au plus par page */
  .semp { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; padding: 66px 60px 0; }
  .semp .filet { margin: 20px 0 32px; }
  .semp h1 { font-family: 'Pathway Gothic One', Arial, sans-serif; font-weight: 400; text-transform: uppercase; letter-spacing: .04em; font-size: 117px; line-height: 1; white-space: nowrap; overflow: hidden; }
  .semp .page { position: absolute; top: 66px; right: 60px; font-size: 28px; line-height: 1; color: #8A8880; letter-spacing: .1em; }
  .jours7 { position: absolute; top: 300px; left: 60px; width: 960px; height: 107px; white-space: nowrap; font-size: 0; }
  .jours7 span { display: inline-block; width: 137px; height: 107px; vertical-align: top; text-align: center; padding-top: 13px; border-top: 6px solid #2A2A30;
    font-size: 28px; line-height: 1; font-weight: 600; color: #8A8880; text-transform: uppercase; letter-spacing: .14em; }
  .jours7 span b { display: block; margin-top: 8px; font-family: 'Pathway Gothic One', Arial, sans-serif; font-weight: 400; font-size: 44px; letter-spacing: .02em; color: #8A8880; }
  .jours7 span.actif { border-top-color: #C12C57; color: #F4F2EC; }
  .jours7 span.actif b { color: #F4F2EC; }
  .films { position: absolute; top: 453px; left: 60px; width: 960px; }
  .fl { position: relative; height: 173px; border-top: 1px solid #2A2A30; }
  .fl img, .fl .vide { position: absolute; top: 13px; left: 0; width: 97px; height: 146px; background: #1C1C20; }
  .fl .ft, .fl .fh { position: absolute; left: 134px; width: 826px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-family: 'Pathway Gothic One', Arial, sans-serif; font-weight: 400; line-height: 1; }
  .fl .ft { top: 26px; font-size: 72px; text-transform: uppercase; letter-spacing: .05em; }
  .fl .fh { top: 110px; font-size: 44px; letter-spacing: .03em; color: #DA5A7E; }
  .fl .fh span { margin-right: 37px; }
  .fl .fh span.passee { opacity: .3; }
  .fl .fh i { font-style: normal; font-family: 'Afacad', Arial, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: .08em; color: #B8B6AE; margin-left: 6px; position: relative; top: -16px; line-height: 0; }
  .semp .rien { position: absolute; top: 453px; left: 60px; font-size: 44px; color: #8A8880; }
  .cosmo .jours7 span.actif { border-top-color: #CFA94E; }
  .cosmo .fl .fh { color: #F0B660; }

  /* Vidéo : hors de la scène, plein écran */
  #video-zone { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; z-index: 10; }
  #video-zone video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; }
  #video-zone .legende { position: absolute; left: 0; bottom: 0; width: 100%; padding: 0 3% 2.5%; color: #FFF; font-family: 'Pathway Gothic One', Arial, sans-serif; text-transform: uppercase; letter-spacing: .06em; text-shadow: 0 2px 12px rgba(0,0,0,.9); }
  #video-zone .legende b { font-weight: 400; color: #FF8FB0; }
</style>

<body>
<div class="scene" id="scene"></div>
<div id="video-zone"><video id="video" muted playsinline preload="auto"></video><div class="legende" id="legende"></div></div>

<script>
(function () {
  'use strict';
  var MODE = 'vitrine';                       // 'local' (serveur du cinéma) ou 'vitrine' (GitHub Pages)
  var MARQUES = {
    palace: { logo: 'marques/palace-logo-blanc.png', filigrane: 'marques/palace-heritage-mark-white.png' },
    cosmo: { logo: 'marques/cosmo-heritage-white-tight.png', filigrane: 'marques/cosmo-heritage-c-white.png' }
  };
  var marque = 'palace', LOGO = MARQUES.palace.logo;
  function choisirMarque(c) {
    c = c === 'cosmo' ? 'cosmo' : 'palace';
    if (c === marque && LOGO) return;
    marque = c; LOGO = MARQUES[c].logo;
    classes();
  }
  // Orientation : &orientation=portrait|paysage, sinon déduite de l'écran (plus haut que large = portrait)
  var PORTRAIT = false, SW = 1920, SH = 1080;
  function classes() {
    document.documentElement.className = (marque === 'cosmo' ? 'cosmo' : '') + (PORTRAIT ? ' portrait' : '');
  }
  var params = {};
  location.search.replace(/^\?/, '').split('&').forEach(function (kv) {
    if (!kv) return;
    var p = kv.split('=');
    params[decodeURIComponent(p[0])] = decodeURIComponent((p[1] || '').replace(/\+/g, ' '));
  });
  var nom = /^[\w-]+$/.test(params.ecran || '') ? params.ecran : '';
  if (params.cinema) choisirMarque(params.cinema);
  var demo = params.demo === '1' || (MODE === 'local' && !/^http/.test(location.protocol));
  var DECALAGE = 0;
  if (params.maintenant) { var lu = lire(params.maintenant); if (lu) DECALAGE = lu.t - Date.now(); }
  function maint() { return Date.now() + DECALAGE; }
  var config = {
    source: MODE === 'vitrine' ? 'ecrans/' + nom + '.json' : '/api/playlist/' + nom,
    relecture: MODE === 'vitrine' ? 15 * 60 * 1000 : 60 * 1000,
    joursMax: 3,
    lignesMax: 7,
    videoDemarrageMax: 15 * 1000,   // une vidéo qui ne démarre pas en 15 s est sautée
    videoDureeMax: 10 * 60 * 1000   // garde-fou pour une vidéo jouée en entier
  };

    // Aperçu de l'admin (?apercu=1) : aucune vidéo chargée, un simple carton de 4 s à la place
    if (params.apercu === '1') {
      couche('<div class="attente"><div style="color:#FFF;font-family:\'Pathway Gothic One\',Arial,sans-serif;font-size:72px;text-transform:uppercase;letter-spacing:.06em;text-align:center">&#9654; Vidéo' +
        (el.titre ? '<br><span style="color:#FF8FB0">' + (el.bientot ? 'Bientôt · ' : '') + esc(el.titre) + '</span>' : '') + '</div></div>', true);
      minuteur = setTimeout(suivant, 4000);
      return;
    }
    var fini = false, demarre = false;
    function fin() {
      if (fini) return; fini = true;
      while (minVideo.length) clearTimeout(minVideo.pop());
      video.onended = video.onerror = video.onplaying = null;
      try { video.pause(); video.removeAttribute('src'); video.load(); } catch (x) {}
      $('video-zone').style.display = 'none';
      suivant();
    }
    $('legende').innerHTML = el.titre ? (el.bientot ? '<b>Bientôt</b> · ' : '') + esc(el.titre) : '';
    $('video-zone').style.display = 'block';
    video.onended = fin; video.onerror = fin;
    video.onplaying = function () {
      if (demarre) return; demarre = true;
      if (Number(el.duree) > 0) minVideo.push(setTimeout(fin, Number(el.duree) * 1000));   // coupée à la durée choisie
    };
    minVideo.push(setTimeout(function () { if (!demarre) fin(); }, config.videoDemarrageMax));
    minVideo.push(setTimeout(fin, Number(el.duree) > 0 ? Number(el.duree) * 1000 + config.videoDemarrageMax : config.videoDureeMax));
    try {
      video.muted = true; video.volume = 0;
      video.src = el.media; video.load();
      var p = video.play();
      if (p && p['catch']) p['catch'](function () { fin(); });
    } catch (x) { fin(); }
  }

  charger();
  setTimeout(suivant, liste.length ? 0 : 1500);   // démarre sur la playlist mémorisée, ou attend la première lecture
  setInterval(charger, demo ? 1000 : config.relecture);
  setInterval(function () { var d = new Date(); if (d.getHours() === 4 && d.getMinutes() === 0) location.reload(); }, 60 * 1000);
})();
</script>

</html>
